[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-yaml-prompt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["yaml_prompt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
